name: Build and Publish VSCode Web Container Image

on:
  schedule:
    # Runs every day at 00:00 UTC. Adjust cron syntax as needed.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set Variables
        id: variables
        run: |
          echo "[INFO] Converting everything to lowercase because ghcr repository name must be lowercase..."
          ACTOR="$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')"
          echo "actor=$ACTOR" >>$GITHUB_OUTPUT
          REPOSITORY="$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')"
          echo "repository=$REPOSITORY" >>$GITHUB_OUTPUT

          echo "[INFO] Getting Latest VSCode-Web version..."
          VSCODEWEB_LATEST="$(curl -s https://registry.npmjs.org/@github1s/vscode-web/latest | jq -r '.version')"
          echo "latest_vscodeweb=$VSCODEWEB_LATEST" >>$GITHUB_OUTPUT
          echo "[INFO] Found latest VSCode-Web version: $VSCODEWEB_LATEST"
          echo "[INFO] Checking if Image Tag Exists in GHCR..."

          TAG="ghcr.io/$ACTOR/vscode-web-standalone:$VSCODEWEB_LATEST"
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "[INFO] Image tag $TAG already exists. Skipping build..."
            echo "imageexists=true" >> $GITHUB_OUTPUT
          else
            echo "[INFO] Image tag $TAG not found. Proceeding with build..."
            echo "imageexists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        if: steps.variables.outputs.imageexists == 'false'
        uses: actions/checkout@v4

      - name: Create Nginx Config
        if: steps.variables.outputs.imageexists == 'false'
        run: |
          cat <<EOF > nginx.conf
          server {
              listen 8000;
              server_name _;
              root /app;
              index index.html;
              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }
          EOF
      - name: Create Containerfile
        if: steps.variables.outputs.imageexists == 'false'
        run: |
          cat <<EOF > Containerfile
          FROM node:alpine as fetcher
          WORKDIR /tmp/package
          RUN npm install @github1s/vscode-web@${{ steps.variables.outputs.latest_vscodeweb }}

          FROM nginx:alpine-slim
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY --from=fetcher /tmp/package/node_modules/@github1s/vscode-web /app
          EXPOSE 8000
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: Set up Docker Buildx
        if: steps.variables.outputs.imageexists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.variables.outputs.imageexists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Container Image
        if: steps.variables.outputs.imageexists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.variables.outputs.actor }}/vscode-web-standalone:${{ steps.variables.outputs.latest_vscodeweb }}
            ghcr.io/${{ steps.variables.outputs.actor }}/vscode-web-standalone:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
